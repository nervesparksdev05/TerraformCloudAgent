name: Remove .env commit

on:
  push:

jobs:
  remove-env:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect .env
        id: detect
        run: |
          if git ls-files | grep -E '^\.env$|\.env$'; then
            echo "env_found=true" >> $GITHUB_OUTPUT
          else
            echo "env_found=false" >> $GITHUB_OUTPUT
          fi

      - name: Remove and force push
        if: steps.detect.outputs.env_found == 'true' && github.ref_name != 'main'
        run: |
          echo "Removing last commit..."
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git reset --hard HEAD~1
          git push --force