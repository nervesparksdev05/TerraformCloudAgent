# docker-compose.yml
services:
  redis:
    image: redis:7-alpine
    command: redis-server --port 6666
    restart: always
    healthcheck:
      test: [ "CMD", "redis-cli", "-p", "6666", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - terranet

  mcp:
    image: node:20-slim
    command: >
      sh -c "npm install -g @modelcontextprotocol/inspector &&  npx @modelcontextprotocol/inspector docker run -i --rm hashicorp/terraform-mcp-server --toolsets=registry"
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
    networks:
      - terranet
    restart: always

  api:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6666
      # GCP credentials path inside the container (matches volume mount below)
      - GCP_CREDENTIALS_PATH=/app/gcp-sa-key.json
    depends_on:
      redis:
        condition: service_healthy
      mcp:
        condition: service_started
    restart: always
    volumes:
      - ./runs:/app/runs
      # Mount your GCP service account key (place it at TerraformCloudAgent/gcp-sa-key.json)
      - ./gcp-sa-key.json:/app/gcp-sa-key.json:ro
    networks:
      - terranet

networks:
  terranet:
    driver: bridge
