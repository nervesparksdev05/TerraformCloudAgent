# docker-compose.yml
services:
  redis:
    image: redis:7-alpine
    restart: always
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - terranet

  api:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379
      # GCP credentials path inside the container (matches volume mount below)
      - GCP_CREDENTIALS_PATH=/app/gcp-sa-key.json
    depends_on:
      redis:
        condition: service_healthy
    restart: always
    volumes:
      - ./runs:/app/runs
      # Mount your GCP service account key (place it at TerraformCloudAgent/gcp-sa-key.json)
      - ./gcp-sa-key.json:/app/gcp-sa-key.json:ro
    networks:
      - terranet

networks:
  terranet:
    driver: bridge
